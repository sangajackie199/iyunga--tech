<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <h1>Add New Student</h1>

   <form id="studentForm">

    <label>Student Name</label>
    <input type="text" id="studentName" placeholder="Enter Full Name">
    <br><br>

    <label>Student ID</label>
    <input type="text" id="studentID" placeholder="Enter Student ID">
    <br><br>

    <label>Gender</label>
    <select id="gender">
        <option>Select Gender</option>
        <option>Male</option>
        <option>Female</option>
    </select>
    <br><br>

    <label>Parent/Guardian Name</label>
    <input type="text" id="studentParentGuardian" placeholder="Enter parent/guardian name">
    <br><br>

    <label>Phone Number</label>
    <input type="tel" id="studentPhone" placeholder="Enter phone Number">
    <br><br>

    <label>Address</label>
    <input type="text" id="studentAddress" placeholder="Enter address">
    <br><br>

    <label>Class</label>
    <input type="text" id="studentClass" placeholder="Enter class">
    <br><br>

    <label>Date of Birth</label>

    <select id="date">
        <option>Select Date</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
        <option>15</option>
        <option>16</option>
        <option>17</option>
        <option>18</option>
        <option>19</option>
        <option>20</option>
        <option>21</option>
        <option>22</option>
        <option>23</option>
        <option>24</option>
        <option>25</option>
        <option>26</option>
        <option>27</option>
        <option>28</option>
        <option>29</option>
        <option>30</option>
        <option>31</option>
    </select>

    <select id="month">
        <option>Select Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
    </select>

    <select id="year">
        <option>Select Year</option>
        <option>1990</option>
        <option>1991</option>
        <option>1992</option>
        <option>1993</option>
        <option>1994</option>
        <option>1995</option>
        <option>1996</option>
        <option>1997</option>
        <option>1998</option>
        <option>1999</option>
        <option>2000</option>
        <option>2001</option>
        <option>2002</option>
        <option>2003</option>
        <option>2004</option>
        <option>2005</option>
        <option>2006</option>
        <option>2007</option>
        <option>2008</option>
        <option>2009</option>
        <option>2010</option>
        <option>2011</option>
        <option>2012</option>
        <option>2013</option>
        <option>2014</option>
        <option>2015</option>
        <option>2016</option>
        <option>2017</option>
        <option>2018</option>
        <option>2019</option>
        <option>2020</option>
    </select>

    <br><br>

    <button type="submit" id="saveStudent">
        Save Student
    </button>

   </form>

   <br><br>

    <!-- Footer Section -->
    <footer class="site-footer">
        <div class="container">

            <p>
                &copy; 2026 Iyunga Secondary School.
                All rights reserved
            </p>

        </div>
    </footer>

   <a href="index.html">Back to Home</a>

   <script src="logics.js"></script>

</body>
</html>
