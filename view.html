<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Student</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student List</h1>
    <p id="studentCount">Total Students: 0</p>

    <input 
    type="text" 
    id="searchStudent" 
    placeholder="Search by name or Student ID">


    <table border="1">

        <thead>
            <tr>
                <th>No.</th>
                <th>Student Name</th>
                <th>Student ID</th>
                <th>Class</th>
                <th>Date of Birth</th>
                <th>Parent/Guardian Name</th>
                <th>Gender</th>
                <th>Address</th>
                <th>Phone Number</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTableBody">
        </tbody>

    </table>

    <br><br>

     <!-- Footer Section -->
     <footer class="site-footer">
        <div class="container">

            <p>

                All rights reserved
            </p>

        </div>
    </footer>

    <a href="index.html">Back to Home</a>

    <script src="logics.js"></script>

</body>
</html>
